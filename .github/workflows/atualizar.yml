# Coletor do Rio Mearim. Vai em .github/workflows/ do repositório PÚBLICO do site.
# O código vem do repositório privado barretojmarcos/ana-pedreiras-api.
# Quem dispara: o relógio externo (cron-job.org chamando workflow_dispatch com relogio=true às :07,
# :22, :37 e :52) e, de reserva, os quatro crons abaixo. O agendamento do GitHub não basta sozinho:
# de 13 a 16/11/2026 ele criou só uma hora de execuções a cada 4 a 8 horas.
# Todo disparo automático (relógio ou cron) passa pelo passo decidir: execução completa quando a ANA
# deve ter lote novo (a leitura que o site público mostra tem 60 min ou mais; a ANA publica de hora em hora,
# às :49) ou quando a última completa (dados/ultima_completa.json) tem 60 min ou mais; senão vigília,
# se dados/vigilia.json estiver com "ativa": true (o próprio coletor liga e desliga); senão nada.
# Disparo manual (Run workflow sem relogio) é sempre completo. Um cron por minuto: o
# github.event.schedule diz qual disparou e o atraso do agendamento é medido mesmo acima de 15 min.
# Segredos necessários: ANA_USER, ANA_PASSWORD, CODIGO_DEPLOY_KEY, TELEGRAM_BOT_TOKEN e
# TELEGRAM_CHAT_ID (sem os dois do Telegram o alerta fica desligado) e, opcional, HEALTHCHECK_URL.
name: atualizar
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      horario:
        description: "Horário HH:MM para o boletim sob demanda (opcional)"
        required: false
      teste_alerta:
        description: "Mandar a mensagem de teste do alerta ao grupo da guarnição"
        type: boolean
        default: false
      relogio:
        description: "Disparo do relógio externo: decide sozinho entre completa, vigília ou nada"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: atualizar
  cancel-in-progress: false
env:
  TZ: America/Fortaleza
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - id: decidir
        name: Decidir se esta execução roda e em que modo
        env:
          AGENDAMENTO: ${{ github.event.schedule }}
          RELOGIO: ${{ inputs.relogio }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          # Só o ramo dados, o site publicado e o python3 do sistema: a execução que não faz nada
          # termina em segundos.
          # A marca da completa é gravada aqui e vai para o ramo dados no passo "Gravar dados".
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # A ANA publica de hora em hora (às :49, as quatro leituras de 15 min juntas). A completa vai
          # atrás do lote: roda quando a leitura mais nova já publicada tem LOTE_NOVO_MIN ou mais (a
          # das :45 completa 60 min às :45 da hora seguinte; o relógio das :52 pega o lote das :49).
          # Se a ANA atrasar, tenta de novo a cada disparo até INSISTIR_ATE_MIN; depois disso a
          # estação está parada e volta à regra da hora. ULTIMA_COMPLETA_MIN garante planilha e tempo
          # atualizados mesmo sem leitura nova; FOLGA_MIN cobre os segundos entre o disparo e a marca
          # (marca às :37:14, disparo às :37:02 seguinte = 59,8 min). INTERVALO_MIN_MIN segura disparos
          # colados (reserva). Site atrasado em relação ao ramo dados (SITE_ATRASADO_MIN) é publicação
          # que falhou depois de gravar os dados: repete a cada disparo, sem o teto de INSISTIR_ATE_MIN
          # (em 24/11/2026 o teto deixou o site parado às 07:45 até as 11:52).
          LOTE_NOVO_MIN = 60
          INSISTIR_ATE_MIN = 180
          ULTIMA_COMPLETA_MIN = 60
          FOLGA_MIN = 1
          INTERVALO_MIN_MIN = 10
          SITE_ATRASADO_MIN = 5
          FUSO = timezone(timedelta(hours=-3))  # Pedreiras, sem horário de verão
          MARCA = Path("dados/ultima_completa.json")
          MEDICOES = Path("dados/medicoes/33281000")  # Pedreiras II, um CSV por mês em ordem
          # A idade da leitura vem do site público, que é o que as pessoas veem: se a publicação falhou
          # depois de gravar os dados, o ramo dados está em dia e o site não. Sem o site, o ramo dados.
          dono, _, nome = os.environ.get("REPOSITORIO", "").partition("/")
          SITE_URL = os.environ.get("SITE_URL") or f"https://{dono}.github.io/{nome}/"
          agora = datetime.now().astimezone()


          def ler(caminho):
              try:
                  conteudo = json.loads(caminho.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return {}
              return conteudo if isinstance(conteudo, dict) else {}


          def minutos_desde(instante):
              minutos = (agora - instante).total_seconds() / 60
              return minutos if minutos >= 0 else None  # no futuro: relógio torto, não confiar


          def leitura_no_site():
              """Minutos desde a leitura que o site público mostra; None se não der para ler."""
              try:
                  sem_cache = f"?t={int(time.time())}" if SITE_URL.startswith("http") else ""  # file:// nos testes
                  pedido = urllib.request.Request(f"{SITE_URL}dados/ultima_medicao.json{sem_cache}",
                                                  headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(pedido, timeout=10) as resposta:
                      conteudo = json.loads(resposta.read().decode("utf-8"))
                  texto = conteudo["medicao"]["data_hora_medicao"] if conteudo.get("ok") is True else None
                  leitura = datetime.strptime(str(texto)[:19].replace("T", " "), "%Y-%m-%d %H:%M:%S")
                  return minutos_desde(leitura.replace(tzinfo=FUSO))
              except Exception:  # fora do ar, sem rede, JSON torto: fica com o ramo dados
                  return None


          def leitura_no_ramo():
              """Minutos desde a leitura com cota mais nova do ramo dados; None se não der para saber.

              Só linhas com cota, como a última medição que o site mostra.
              """
              try:
                  for arquivo in sorted(MEDICOES.glob("*.csv"), reverse=True):
                      linhas = arquivo.read_text(encoding="utf-8").splitlines()[1:]
                      for linha in reversed(linhas):
                          campos = linha.split(",")
                          if len(campos) > 1 and campos[1].strip():
                              leitura = datetime.strptime(campos[0], "%Y-%m-%d %H:%M:%S")
                              return minutos_desde(leitura.replace(tzinfo=FUSO))
              except (OSError, ValueError):
                  pass
              return None


          try:
              idade = minutos_desde(datetime.fromisoformat(ler(MARCA)["inicio"]))
          except (KeyError, TypeError, ValueError):
              idade = None  # sem marca, ilegível ou sem fuso: monta o site
          site, ramo = leitura_no_site(), leitura_no_ramo()
          leitura, fonte = (site, "site") if site is not None else (ramo, "ramo dados")
          automatico = bool(os.environ.get("AGENDAMENTO")) or os.environ.get("RELOGIO") == "true"
          pode_repetir = idade is not None and idade >= INTERVALO_MIN_MIN
          lote_novo = pode_repetir and leitura is not None and LOTE_NOVO_MIN <= leitura < INSISTIR_ATE_MIN
          site_atrasado = site is not None and ramo is not None and site - ramo >= SITE_ATRASADO_MIN
          if (not automatico or idade is None or idade >= ULTIMA_COMPLETA_MIN - FOLGA_MIN or lote_novo
                  or (pode_repetir and site_atrasado)):
              modo = "completo"
              MARCA.write_text(json.dumps({"inicio": agora.isoformat(timespec="seconds")}) + "\n",
                               encoding="utf-8")
          elif ler(Path("dados/vigilia.json")).get("ativa") is True:
              modo = "vigilia"
          else:
              modo = ""
          def texto(minutos):
              return "?" if minutos is None else round(minutos)


          print(f"última completa há {texto(idade)} min; leitura publicada há {texto(leitura)} min "
                f"({fonte}); no ramo dados há {texto(ramo)} min"
                f"{'; site atrasado: publicação anterior falhou' if site_atrasado else ''}; "
                f"modo: {modo or 'nenhum'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as saida:
              saida.write(f"rodar={'true' if modo else 'false'}\nmodo={modo}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.decidir.outputs.rodar == 'true'
        with:
          repository: barretojmarcos/ana-pedreiras-api
          ssh-key: ${{ secrets.CODIGO_DEPLOY_KEY }}
          path: codigo
      - uses: actions/setup-python@v5
        if: steps.decidir.outputs.rodar == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: codigo/requirements-prod.txt
      - if: steps.decidir.outputs.rodar == 'true'
        run: pip install -r codigo/requirements-prod.txt
      - name: Ler a hora de início da execução
        if: steps.decidir.outputs.rodar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O contexto github não tem a hora em que a execução começou; o atraso do agendamento é medido
          # dela. O token fica só neste passo. Se a consulta falhar, o coletor usa o próprio relógio.
          inicio=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at 2>/dev/null || true)
          echo "INICIO_EXECUCAO=$inicio" >> "$GITHUB_ENV"
      - name: Coletar e montar o site
        if: steps.decidir.outputs.rodar == 'true'
        working-directory: codigo
        env:
          ANA_USER: ${{ secrets.ANA_USER }}
          ANA_PASSWORD: ${{ secrets.ANA_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HORARIO: ${{ inputs.horario }}
          TESTE_ALERTA: ${{ inputs.teste_alerta }}
          AGENDADO: ${{ github.event.schedule }}
          MODO: ${{ steps.decidir.outputs.modo }}
        run: |
          args=(--modo "$MODO")
          if [ "$TESTE_ALERTA" = "true" ]; then args+=(--teste-alerta); fi
          python atualizar.py --dados ../dados --site ../_site --horario "$HORARIO" "${args[@]}"
      - id: gravar
        name: Gravar dados
        if: always() && steps.decidir.outputs.rodar == 'true'
        working-directory: dados
        run: |
          git config user.name "coletor-mearim"
          git config user.email "coletor-mearim@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "dados: $(date +%Y-%m-%dT%H:%M)"
          # O Mac também grava no ramo dados (sigop/efetivo.json, arquivo que o coletor não toca):
          # traz o que chegou durante a execução antes de enviar.
          # O commit enviado é a versão da publicação do site (passo "Publicar o site"): existe no repositório e
          # muda a cada completa.
          for tentativa in 1 2 3; do
            if git pull -q --rebase origin dados && git push -q; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - id: pacote
        uses: actions/upload-pages-artifact@v3
        if: steps.decidir.outputs.rodar == 'true'
        with:
          path: _site
      - id: publicar
        name: Publicar o site e conferir no ar
        if: steps.decidir.outputs.rodar == 'true'
        working-directory: codigo
        env:
          # Publica pelo número do pacote, com o commit gravado no ramo dados como versão, e confere o
          # status.json no ar.
          # Não usa actions/deploy-pages: ela procura o pacote por listagem e falha logo depois do envio
          # (actions/deploy-pages#451) e repete o GITHUB_SHA como versão nos disparos manuais, dizendo
          # sucesso sem publicar (#383). Ver publicar_pages.py.
          GH_TOKEN: ${{ github.token }}
          ARTEFATO: ${{ steps.pacote.outputs.artifact_id }}
          VERSAO: ${{ steps.gravar.outputs.sha }}
        run: python publicar_pages.py --artefato "$ARTEFATO" --site ../_site
      - name: Manter o agendamento ativo
        if: steps.decidir.outputs.rodar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar.yml/enable"
      - name: Avisar o monitor
        if: always() && (steps.decidir.outputs.modo == 'completo' || steps.decidir.outcome != 'success')
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          SUFIXO: ${{ job.status == 'success' && '' || '/fail' }}
        run: '[ -z "$HEALTHCHECK_URL" ] || curl -fsS -m 10 --retry 3 "${HEALTHCHECK_URL}${SUFIXO}" || true'
